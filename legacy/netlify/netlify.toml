# Configuración de Netlify
[functions]
  directory = "netlify/functions"

# La función de inicio de sesión nunca debe guardarse en caché
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# Misma ruta que en Cloudflare: el cliente siempre llama a /api/utesa-login
[[redirects]]
  from = "/api/utesa-login"
  to = "/.netlify/functions/utesa-login"
  status = 200
