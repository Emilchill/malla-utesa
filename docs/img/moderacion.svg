<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-label="Moderación">
<title>Moderación</title>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b2a17" flood-opacity=".12"/></filter>
  <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#00542B"/></marker><marker id="ar-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#C89B3C"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2F6FB0"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6B7568"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#C7402C"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6D4BC2"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#17211A"/></marker>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#DCE3D8"/></pattern>
</defs>
<rect x="1" y="1" width="978" height="518" rx="18" fill="#F7F9F6" stroke="#DDE3DA" stroke-width="1.5"/>
<rect x="1" y="1" width="978" height="518" rx="18" fill="url(#dots)" opacity=".7"/>
<rect x="0" y="0" width="980" height="6" rx="3" fill="#00542B"/>
<text x="28" y="44" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#17211A">Moderación</text>
<text x="28" y="66" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6B7568">Diagrama de actividad · qué pasa cuando se reporta algo</text>
<circle cx="70" cy="140" r="11" fill="#17211A"/><g filter="url(#sh)">
  <rect x="110" y="104" width="200" height="72" rx="12" fill="#FFFFFF" stroke="#17211A" stroke-width="2"/>
  <path d="M110 116 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v22 h-200z" fill="#EEF1EC"/>
  <line x1="110" y1="138" x2="310" y2="138" stroke="#17211A" stroke-width="1.2" opacity=".45"/>
  
  <text x="210" y="127" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Alguien reporta</text>
  <text x="122" y="158" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">motivo + detalle</text>
</g><g filter="url(#sh)">
  <rect x="360" y="104" width="230" height="72" rx="12" fill="#FFFFFF" stroke="#00542B" stroke-width="2"/>
  <path d="M360 116 a12 12 0 0 1 12 -12 h206 a12 12 0 0 1 12 12 v22 h-230z" fill="#E3EFE6"/>
  <line x1="360" y1="138" x2="590" y2="138" stroke="#00542B" stroke-width="1.2" opacity=".45"/>
  
  <text x="475" y="127" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Moderación</text>
  <text x="372" y="158" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Configuración → Moderación</text>
</g><path d="M81 140 L110 140" stroke="#17211A" stroke-width="2" marker-end="url(#ar-ink)"/><path d="M310 140 L360 140" stroke="#00542B" stroke-width="2" marker-end="url(#ar-green)"/><path d="M640 110 L680 140 L640 170 L600 140z" fill="#FBF2DC" stroke="#C89B3C" stroke-width="2"/><path d="M590 140 L600 140" stroke="#00542B" stroke-width="2"/><text x="735" y="132" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#C89B3C" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">¿qué hacer?</text><path d="M640 170 C 640 250, 660 256, 700 256" fill="none" stroke="#2F6FB0" stroke-width="2" marker-end="url(#ar-blue)"/><g filter="url(#sh)">
  <rect x="700" y="230" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#2F6FB0" stroke-width="2"/>
  <path d="M700 242 a12 12 0 0 1 12 -12 h226 a12 12 0 0 1 12 12 v22 h-250z" fill="#E4EEF9"/>
  <line x1="700" y1="264" x2="950" y2="264" stroke="#2F6FB0" stroke-width="1.2" opacity=".45"/>
  
  <text x="825" y="251" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Ocultar mensaje</text>
  
</g><text x="825" y="277" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">el texto queda como evidencia</text><circle r="5" fill="#2F6FB0" opacity="0"><animateMotion dur="2.2s" begin="0.5s" repeatCount="indefinite" path="M640 170 C 640 250, 660 256, 700 256"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.2s" begin="0.5s" repeatCount="indefinite"/></circle><path d="M640 170 C 640 316, 660 322, 700 322" fill="none" stroke="#C89B3C" stroke-width="2" marker-end="url(#ar-gold)"/><g filter="url(#sh)">
  <rect x="700" y="296" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#C89B3C" stroke-width="2"/>
  <path d="M700 308 a12 12 0 0 1 12 -12 h226 a12 12 0 0 1 12 12 v22 h-250z" fill="#FBF2DC"/>
  <line x1="700" y1="330" x2="950" y2="330" stroke="#C89B3C" stroke-width="1.2" opacity=".45"/>
  
  <text x="825" y="317" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Suspender del chat</text>
  
</g><text x="825" y="343" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">10 min a 30 días · con motivo</text><circle r="5" fill="#C89B3C" opacity="0"><animateMotion dur="2.2s" begin="1.05s" repeatCount="indefinite" path="M640 170 C 640 316, 660 322, 700 322"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.2s" begin="1.05s" repeatCount="indefinite"/></circle><path d="M640 170 C 640 382, 660 388, 700 388" fill="none" stroke="#6D4BC2" stroke-width="2" marker-end="url(#ar-violet)"/><g filter="url(#sh)">
  <rect x="700" y="362" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#6D4BC2" stroke-width="2"/>
  <path d="M700 374 a12 12 0 0 1 12 -12 h226 a12 12 0 0 1 12 12 v22 h-250z" fill="#EEE8FA"/>
  <line x1="700" y1="396" x2="950" y2="396" stroke="#6D4BC2" stroke-width="1.2" opacity=".45"/>
  
  <text x="825" y="383" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Reiniciar cuenta</text>
  
</g><text x="825" y="409" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">vuelve a configurar su perfil</text><circle r="5" fill="#6D4BC2" opacity="0"><animateMotion dur="2.2s" begin="1.6s" repeatCount="indefinite" path="M640 170 C 640 382, 660 388, 700 388"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.2s" begin="1.6s" repeatCount="indefinite"/></circle><path d="M640 170 C 640 448, 660 454, 700 454" fill="none" stroke="#C7402C" stroke-width="2" marker-end="url(#ar-red)"/><g filter="url(#sh)">
  <rect x="700" y="428" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#C7402C" stroke-width="2"/>
  <path d="M700 440 a12 12 0 0 1 12 -12 h226 a12 12 0 0 1 12 12 v22 h-250z" fill="#FBE7E3"/>
  <line x1="700" y1="462" x2="950" y2="462" stroke="#C7402C" stroke-width="1.2" opacity=".45"/>
  
  <text x="825" y="449" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Eliminar (dueño)</text>
  
</g><text x="825" y="475" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">queda en «Eliminadas»</text><circle r="5" fill="#C7402C" opacity="0"><animateMotion dur="2.2s" begin="2.1500000000000004s" repeatCount="indefinite" path="M640 170 C 640 448, 660 454, 700 454"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.2s" begin="2.1500000000000004s" repeatCount="indefinite"/></circle><g filter="url(#sh)">
  <rect x="330" y="330" width="250" height="86" rx="12" fill="#FFFFFF" stroke="#C89B3C" stroke-width="2"/>
  <path d="M330 342 a12 12 0 0 1 12 -12 h226 a12 12 0 0 1 12 12 v22 h-250z" fill="#FBF2DC"/>
  <line x1="330" y1="364" x2="580" y2="364" stroke="#C89B3C" stroke-width="1.2" opacity=".45"/>
  
  <text x="455" y="353" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Registro de moderación</text>
  <text x="342" y="384" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">quién · qué · a quién · cuándo</text>
</g><path d="M700 300 C 640 340, 620 360, 580 368" fill="none" stroke="#C89B3C" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ar-gold)"/><g filter="url(#sh)">
  <rect x="60" y="330" width="220" height="86" rx="12" fill="#FFFFFF" stroke="#00542B" stroke-width="2"/>
  <path d="M60 342 a12 12 0 0 1 12 -12 h196 a12 12 0 0 1 12 12 v22 h-220z" fill="#E3EFE6"/>
  <line x1="60" y1="364" x2="280" y2="364" stroke="#00542B" stroke-width="1.2" opacity=".45"/>
  
  <text x="170" y="353" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Reactivar</text>
  <text x="72" y="384" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">vuelve con su perfil</text><text x="72" y="401" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">y su avance</text>
</g><path d="M700 452 C 500 500, 300 470, 200 418" fill="none" stroke="#C7402C" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ar-red)"/><text x="430" y="488" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#C7402C" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">el dueño puede reactivar</text><text x="455" y="318" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#C89B3C" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">todo queda anotado</text><circle r="5" fill="#17211A" opacity="0"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M81 140 L110 140 M310 140 L600 140"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle><text x="952" y="500" text-anchor="end" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6B7568">La persona suspendida o eliminada ve el motivo en su pantalla.</text>
</svg>
