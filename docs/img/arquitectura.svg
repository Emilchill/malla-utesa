  <text x="455" y="148" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#00542B" opacity=".9">«componente»</text>
  <text x="455" y="166" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Cloudflare Pages</text>
  <text x="292" y="196" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Sitio estático: HTML, CSS y JS (app/)</text><text x="292" y="213" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Sin build · cache-busting por commit</text>
</g>
  <g filter="url(#sh)">
  <rect x="280" y="300" width="175" height="150" rx="12" fill="#FFFFFF" stroke="#00542B" stroke-width="2"/>
  <path d="M280 312 a12 12 0 0 1 12 -12 h151 a12 12 0 0 1 12 12 v34 h-175z" fill="#E3EFE6"/>
  <line x1="280" y1="346" x2="455" y2="346" stroke="#00542B" stroke-width="1.2" opacity=".45"/>
  <text x="367.5" y="318" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#00542B" opacity=".9">«componente»</text>
  <text x="367.5" y="336" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Worker /api</text>
  <text x="292" y="366" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Verifica el token</text><text x="292" y="383" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Permisos y límites</text><text x="292" y="400" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Moderación</text><text x="292" y="417" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Vinculación UTESA</text>
</g>
  <g filter="url(#sh)">
