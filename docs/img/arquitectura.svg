  <text x="555" y="336" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">D1 (SQLite)</text>
  <text x="492" y="366" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Perfiles y avance</text><text x="492" y="383" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Chat y amistades</text><text x="492" y="400" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Suspensiones</text><text x="492" y="417" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Registro</text>
</g>
  <g filter="url(#sh)">
