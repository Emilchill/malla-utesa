  <text x="832" y="156" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Firebase</text>
  <text x="724" y="186" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Auth: inicio de sesión</text><text x="724" y="203" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Firestore: avisos en vivo</text><text x="724" y="220" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">(sin contenido de mensajes)</text>
</g>
  <g filter="url(#sh)">
