  <text x="122" y="246" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#17211A" opacity=".9">«actor»</text>
  <text x="122" y="264" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17211A">Estudiante</text>
  <text x="44" y="294" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Navegador o teléfono</text><text x="44" y="311" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" opacity=".85">Marcador (opcional)</text>
</g>
  <g filter="url(#sh)">
