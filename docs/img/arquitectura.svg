  <text x="122" y="368" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#00542B" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">2 · API con token</text>
  <text x="470" y="104" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6D4BC2" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">inicio de sesión · token</text>
  <text x="612" y="262" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6D4BC2" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">verifica la firma</text>
  <text x="668" y="438" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#C7402C" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">inicio directo</text>
  <text x="450" y="528" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#C7402C" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">marcador: corre en el navegador del estudiante</text>

