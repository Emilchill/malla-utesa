  <path class="flow b" d="M-20 352C243.2 408 473.6 272 716.8000000000001 320S1088 408 1300 320"/>
</g>
<rect x=".75" y=".75" width="1278.5" height="398.5" rx="26" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1.5"/>
<text x="44" y="56" font-size="12.5" font-weight="700" letter-spacing=".16em" fill="#35D6EA" opacity=".9">ESTADOS</text>
<text x="44" y="88" font-size="27" font-weight="800" fill="#F3F6FF">El camino de cada materia</text>
