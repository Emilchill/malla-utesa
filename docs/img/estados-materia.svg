<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="El camino de cada materia">
<title>El camino de cada materia</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset=".55" stop-color="#19123F"/><stop offset="1" stop-color="#07293A"/></linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9B82FF"/><stop offset=".5" stop-color="#6FA8FF"/><stop offset="1" stop-color="#35D6EA"/></linearGradient>
  <radialGradient id="glow1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".40"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22C8E6" stop-opacity=".28"/><stop offset="1" stop-color="#22C8E6" stop-opacity="0"/></radialGradient>
  <radialGradient id="halo-green" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3DDC97" stop-opacity=".55"/><stop offset="1" stop-color="#3DDC97" stop-opacity="0"/></radialGradient><radialGradient id="halo-gold" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F2C26B" stop-opacity=".55"/><stop offset="1" stop-color="#F2C26B" stop-opacity="0"/></radialGradient><radialGradient id="halo-blue" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6FA8FF" stop-opacity=".55"/><stop offset="1" stop-color="#6FA8FF" stop-opacity="0"/></radialGradient><radialGradient id="halo-red" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF7A8A" stop-opacity=".55"/><stop offset="1" stop-color="#FF7A8A" stop-opacity="0"/></radialGradient><radialGradient id="halo-violet" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#A18BFF" stop-opacity=".55"/><stop offset="1" stop-color="#A18BFF" stop-opacity="0"/></radialGradient><radialGradient id="halo-cyan" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#35D6EA" stop-opacity=".55"/><stop offset="1" stop-color="#35D6EA" stop-opacity="0"/></radialGradient><radialGradient id="halo-gray" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8E9AC0" stop-opacity=".55"/><stop offset="1" stop-color="#8E9AC0" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="card"><rect width="1280" height="400" rx="26"/></clipPath>
</defs>
<style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif }
  .flow { fill: none; stroke: url(#ink); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 22; opacity: .22; animation: run 12s linear infinite }
  .flow.b { animation-duration: 17s; opacity: .14 }
  .lnk { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 2 14; animation: run 3.2s linear infinite }
  .lnk.slow { animation-duration: 5s }
  @keyframes run { to { stroke-dashoffset: -560 } }
  @media (prefers-reduced-motion: reduce) { .flow, .lnk { animation: none } }
</style>
<g clip-path="url(#card)">
  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="128" cy="380" r="409.6" fill="url(#glow1)"/>
  <circle cx="1177.6000000000001" cy="24" r="409.6" fill="url(#glow2)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
