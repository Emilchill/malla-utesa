  <circle cx="190" cy="230" r="44" fill="#12163A" stroke="#8E9AC0" stroke-opacity=".75" stroke-width="1.8" stroke-dasharray="5 5"/>
  <circle cx="190" cy="230" r="38" fill="none" stroke="#fff" stroke-opacity=".06"/>
