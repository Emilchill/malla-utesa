  <text x="640.0" y="168.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6FA8FF">la inscribes</text></g><g><rect x="889.0" y="150" width="101.9" height="28" rx="14" fill="#12163A" fill-opacity=".92" stroke="#3DDC97" stroke-opacity=".45"/>
  
  <text x="940.0" y="168.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3DDC97">la apruebas</text></g><g>
