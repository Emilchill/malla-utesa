<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img" aria-label="Estados de una materia">
<title>Estados de una materia</title>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b2a17" flood-opacity=".12"/></filter>
  <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#00542B"/></marker><marker id="ar-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#C89B3C"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2F6FB0"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6B7568"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#C7402C"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6D4BC2"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#17211A"/></marker>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#DCE3D8"/></pattern>
</defs>
<rect x="1" y="1" width="978" height="378" rx="18" fill="#F7F9F6" stroke="#DDE3DA" stroke-width="1.5"/>
<rect x="1" y="1" width="978" height="378" rx="18" fill="url(#dots)" opacity=".7"/>
<rect x="0" y="0" width="980" height="6" rx="3" fill="#00542B"/>
<text x="28" y="44" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#17211A">Estados de una materia</text>
<text x="28" y="66" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6B7568">Diagrama de estados · el punto recorre el camino normal de una materia</text>
<circle cx="40" cy="196" r="9" fill="#17211A"/><line x1="49" y1="196" x2="68" y2="196" stroke="#17211A" stroke-width="2" marker-end="url(#ar-ink)"/><g filter="url(#sh)"><rect x="70" y="160" width="160" height="72" rx="36" fill="#EEF1EC" stroke="#6B7568" stroke-width="2.2" stroke-dasharray="6 5">
      <animate attributeName="stroke-width" values="2.2;2.2;5;2.2;2.2" keyTimes="0;0.04;0.08;0.22;1" dur="8s" repeatCount="indefinite"/></rect></g>
      <text x="150" y="193" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#17211A">Bloqueada</text>
      <text x="150" y="213" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#17211A" opacity=".7">faltan requisitos</text><g filter="url(#sh)"><rect x="300" y="160" width="160" height="72" rx="36" fill="#FBF2DC" stroke="#C89B3C" stroke-width="2.2">
      <animate attributeName="stroke-width" values="2.2;2.2;5;2.2;2.2" keyTimes="0;0.30;0.34;0.48;1" dur="8s" repeatCount="indefinite"/></rect></g>
      <text x="380" y="193" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#17211A">Disponible</text>
      <text x="380" y="213" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#17211A" opacity=".7">se puede inscribir</text><g filter="url(#sh)"><rect x="530" y="160" width="160" height="72" rx="36" fill="#E4EEF9" stroke="#2F6FB0" stroke-width="2.2">
      <animate attributeName="stroke-width" values="2.2;2.2;5;2.2;2.2" keyTimes="0;0.55;0.59;0.73;1" dur="8s" repeatCount="indefinite"/></rect></g>
      <text x="610" y="193" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#17211A">En curso</text>
      <text x="610" y="213" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#17211A" opacity=".7">inscrita este cuatrimestre</text><g filter="url(#sh)"><rect x="760" y="160" width="160" height="72" rx="36" fill="#E3EFE6" stroke="#00542B" stroke-width="2.2">
      <animate attributeName="stroke-width" values="2.2;2.2;5;2.2;2.2" keyTimes="0;0.80;0.84;0.97;1" dur="8s" repeatCount="indefinite"/></rect></g>
      <text x="840" y="193" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#17211A">Aprobada</text>
      <text x="840" y="213" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#17211A" opacity=".7">cuenta para el avance</text><line x1="230" y1="196" x2="298" y2="196" stroke="#C89B3C" stroke-width="2.2" marker-end="url(#ar-gold)"/><text x="264" y="184" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">requisitos ✓</text><line x1="460" y1="196" x2="528" y2="196" stroke="#2F6FB0" stroke-width="2.2" marker-end="url(#ar-blue)"/><text x="494" y="184" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">la inscribes</text><line x1="690" y1="196" x2="758" y2="196" stroke="#00542B" stroke-width="2.2" marker-end="url(#ar-green)"/><text x="724" y="184" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">la apruebas</text><path d="M590 232 C 560 312, 420 312, 390 236" fill="none" stroke="#C7402C" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-red)"/><text x="490" y="310" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#C7402C" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">reprobada o retirada</text><path d="M380 160 C 400 90, 760 90, 830 158" fill="none" stroke="#00542B" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#ar-green)" opacity=".7"/><text x="605" y="106" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#00542B" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">convalidada o marcada a mano</text><circle r="9" fill="#fff" stroke="#17211A" stroke-width="2.5"><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0.02;0.32;0.36;0.66;0.7;1;1" keyTimes="0;0.04;0.26;0.3;0.51;0.55;0.8;1" calcMode="linear" path="M150 196 L840 196"/>
    <animate attributeName="fill" values="#EEF1EC;#C89B3C;#2F6FB0;#00542B;#00542B" keyTimes="0;0.3;0.55;0.8;1" dur="8s" repeatCount="indefinite"/></circle><text x="952" y="358" text-anchor="end" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#6B7568">Colores iguales a los de la app: gris, dorado, azul y verde.</text>
</svg>
