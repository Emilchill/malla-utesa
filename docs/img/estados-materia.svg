  <g transform="translate(470.2 210.2) scale(1.650)" fill="none" stroke="#F2C26B" stroke-width="0.97" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 7.7-1.5"/></g>
  <text x="490" y="304" text-anchor="middle" font-size="16.5" font-weight="700" fill="#F3F6FF">Disponible</text>
  <text x="490" y="326" text-anchor="middle" font-size="13" fill="#B4BFE3">la puedes inscribir</text>
</g><g>
  <circle cx="790" cy="230" r="88" fill="url(#halo-blue)" opacity=".3"><animate attributeName="opacity" values=".3;.3;1;.3;.3" keyTimes="0;0.520;0.560;0.700;1" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="790" cy="230" r="44" fill="#12163A" stroke="#6FA8FF" stroke-opacity=".75" stroke-width="1.8"/>
  <circle cx="790" cy="230" r="38" fill="none" stroke="#fff" stroke-opacity=".06"/>
  <g transform="translate(770.2 210.2) scale(1.650)" fill="none" stroke="#6FA8FF" stroke-width="0.97" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/></g>
  <text x="790" y="304" text-anchor="middle" font-size="16.5" font-weight="700" fill="#F3F6FF">En curso</text>
  <text x="790" y="326" text-anchor="middle" font-size="13" fill="#B4BFE3">este cuatrimestre</text>
</g><g>
  <circle cx="1090" cy="230" r="88" fill="url(#halo-green)" opacity=".3"><animate attributeName="opacity" values=".3;.3;1;.3;.3" keyTimes="0;0.780;0.820;0.960;1" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="1090" cy="230" r="44" fill="#12163A" stroke="#3DDC97" stroke-opacity=".75" stroke-width="1.8"/>
