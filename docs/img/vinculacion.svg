        <circle r="4.5" fill="#C7402C"><animateMotion dur="0.7s" begin="6.9s;22.9s;38.9s" fill="freeze" path="M590 396 L850 396"/></circle>
        <text x="720" y="388" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">7. cierra sesión</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.497;0.532;0.94;1" dur="16s" repeatCount="indefinite"/><path d="M590 428 h46 v22 h-40" fill="none" stroke="#00542B" stroke-width="2" marker-end="url(#ar-green)"/><text x="646" y="444" text-anchor="start" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">calcula avance y logros · descarta la contraseña</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.563;0.598;0.94;1" dur="16s" repeatCount="indefinite"/><line x1="590" y1="472" x2="344" y2="472" stroke="#00542B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-green)"/>
        <circle r="4.5" fill="#00542B"><animateMotion dur="0.7s" begin="9s;25s;41s" fill="freeze" path="M590 472 L340 472"/></circle>
        <text x="465" y="464" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">9. aprobadas · en curso · contadores</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.628;0.663;0.94;1" dur="16s" repeatCount="indefinite"/><line x1="340" y1="510" x2="114" y2="510" stroke="#17211A" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-ink)"/>
        <circle r="4.5" fill="#17211A"><animateMotion dur="0.7s" begin="10.05s;26.05s;42.05s" fill="freeze" path="M340 510 L110 510"/></circle>
        <text x="225" y="502" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">10. revisa la lista antes de guardar</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.694;0.729;0.94;1" dur="16s" repeatCount="indefinite"/><line x1="110" y1="548" x2="336" y2="548" stroke="#17211A" stroke-width="2" marker-end="url(#ar-ink)"/>
        <circle r="4.5" fill="#17211A"><animateMotion dur="0.7s" begin="11.1s;27.1s;43.1s" fill="freeze" path="M110 548 L340 548"/></circle>
        <text x="225" y="540" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">11. confirma</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.759;0.794;0.94;1" dur="16s" repeatCount="indefinite"/><line x1="340" y1="586" x2="586" y2="586" stroke="#00542B" stroke-width="2" marker-end="url(#ar-green)"/>
        <circle r="4.5" fill="#00542B"><animateMotion dur="0.7s" begin="12.15s;28.15s;44.15s" fill="freeze" path="M340 586 L590 586"/></circle>
        <text x="465" y="578" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">12. PUT /api/user → guardado en D1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.800;0.835;0.94;1" dur="16s" repeatCount="indefinite"/><g filter="url(#sh)"><rect x="440" y="634" width="300" height="56" rx="10" fill="#FBF2DC" stroke="#C89B3C" stroke-width="1.5"/></g>
    <text x="456" y="657" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#17211A">La contraseña solo existe en memoria</text>
    <text x="456" y="676" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#17211A" opacity=".8">durante esta petición; nunca se guarda.</text></g>
