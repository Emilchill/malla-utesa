        <circle r="4.5" fill="#C7402C"><animateMotion dur="0.7s" begin="3.7500000000000004s;19.75s;35.75s" fill="freeze" path="M590 282 L850 282"/></circle>
        <text x="720" y="274" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">4. asignaturas pendientes</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.300;0.335;0.94;1" dur="16s" repeatCount="indefinite"/><line x1="590" y1="320" x2="846" y2="320" stroke="#C7402C" stroke-width="2" marker-end="url(#ar-red)"/>
        <circle r="4.5" fill="#C7402C"><animateMotion dur="0.7s" begin="4.8s;20.8s;36.8s" fill="freeze" path="M590 320 L850 320"/></circle>
        <text x="720" y="312" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">5. asignaturas inscritas (en curso)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.366;0.401;0.94;1" dur="16s" repeatCount="indefinite"/><line x1="590" y1="358" x2="846" y2="358" stroke="#C7402C" stroke-width="2" marker-end="url(#ar-red)"/>
        <circle r="4.5" fill="#C7402C"><animateMotion dur="0.7s" begin="5.85s;21.85s;37.85s" fill="freeze" path="M590 358 L850 358"/></circle>
