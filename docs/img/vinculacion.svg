    <text x="110" y="114" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#17211A">Estudiante</text>
    <line x1="110" y1="130" x2="110" y2="680" stroke="#17211A" stroke-width="1.6" stroke-dasharray="6 6" opacity=".55"/>
