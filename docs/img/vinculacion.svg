        <circle r="4.5" fill="#17211A"><animateMotion dur="0.7s" begin="0.6s;16.6s;32.6s" fill="freeze" path="M110 168 L340 168"/></circle>
        <text x="225" y="160" text-anchor="middle" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#17211A" paint-order="stroke" stroke="#F7F9F6" stroke-width="4" stroke-linejoin="round">1. matrícula + contraseña</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.103;0.138;0.94;1" dur="16s" repeatCount="indefinite"/><line x1="340" y1="206" x2="586" y2="206" stroke="#00542B" stroke-width="2" marker-end="url(#ar-green)"/>
